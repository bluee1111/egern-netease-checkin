name: "网易云音乐自动签到"
description: "自动抓取网易云 MUSIC_U Cookie，每日完成安卓端和 Web 端签到，并推送结果通知"
author: "buleeee1111"
homepage: "https://github.com/buleeee1111/egern-netease-checkin"
icon: "music.note.list"

compat_arguments:
  CronExp: "10 0 * * *"

compat_arguments_desc: |
  CronExp: 每日签到时间（Cron 表达式）
  默认 10 0 * * *，即每天 00:10

env_schema:
  ENABLE_CAPTURE:
    name: "自动获取 Cookie"
    description: "打开网易云音乐 App 或 music.163.com 时保存登录 Cookie"
    default_value: "true"
    options:
      - "true"
      - "false"
  ENABLE_SIGN:
    name: "每日自动签到"
    description: "按设定时间完成安卓端和 Web 端签到"
    default_value: "true"
    options:
      - "true"
      - "false"
  NOTIFY_CAPTURE:
    name: "Cookie 获取通知"
    description: "首次成功验证并保存网易云 Cookie 时发送通知"
    default_value: "true"
    options:
      - "true"
      - "false"

scriptings:
  - http_request:
      name: "网易云 Cookie 获取"
      match: "^https:\\/\\/(music\\.163\\.com|interface3\\.music\\.163\\.com|interface\\.music\\.163\\.com)\\/"
      script_url: "https://raw.githubusercontent.com/buleeee1111/egern-netease-checkin/main/netease-checkin.js?v=4"
      timeout: 30
      update_interval: 86400
      enabled: "{{{ENABLE_CAPTURE}}}"

  - schedule:
      name: "网易云音乐每日签到"
      cron: "{{{CronExp}}}"
      script_url: "https://raw.githubusercontent.com/buleeee1111/egern-netease-checkin/main/netease-checkin.js?v=4"
      timeout: 90
      update_interval: 86400
      enabled: "{{{ENABLE_SIGN}}}"

mitm:
  hostnames:
    includes:
      - "music.163.com"
      - "interface3.music.163.com"
      - "interface.music.163.com"
