name: "网易云音乐自动签到"
description: "每日 00:10 自动签到网易云音乐（积分+云贝+VIP成长值），不自动获取 Cookie"
author: "buleeee1111"
homepage: "https://github.com/buleeee1111/egern-netease-checkin"
icon: "music.note.list"

compat_arguments:
  CronExp: "10 0 * * *"

compat_arguments_desc: |
  CronExp: 每日签到时间（Cron 表达式）
  默认 10 0 * * *，即每天 00:10

scriptings:
  - schedule:
      name: "网易云音乐每日签到"
      cron: "{{{CronExp}}}"
      script_url: "https://raw.githubusercontent.com/buleeee1111/egern-netease-checkin/main/netease-checkin-v9.js?v=8"
      timeout: 90
      update_interval: 86400
