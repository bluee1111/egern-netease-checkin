name: "网易云音乐自动签到"
description: "可开关的网易云 Cookie 自动保存 + 每日 00:10 自动签到（积分+云贝+VIP成长值）"
author: "buleeee1111"
homepage: "https://github.com/buleeee1111/egern-netease-checkin"
icon: "music.note.list"

compat_arguments:
  CronExp: "10 0 * * *"
  ENABLE_CAPTURE: "true"

compat_arguments_desc: |
  CronExp=每日签到时间（Cron 表达式），默认 10 0 * * * 即每天 00:10
  ENABLE_CAPTURE=自动获取 Cookie（true 开 / false 关），默认 true

env_schema:
  ENABLE_CAPTURE:
    name: "自动获取 Cookie"
    description: "开启后打开网易云 App 自动保存 Cookie（静默不通知）；关闭后不抓 Cookie（签到仍照常）"
    default_value: "true"
    options:
      - "true"
      - "false"

scriptings:
  - http_request:
      name: "网易云 Cookie 自动保存"
      match: "^https:\\/\\/(.*\\.)?(music\\.163\\.com|interface3\\.music\\.163\\.com|interface\\.music\\.163\\.com|m\\.music\\.163\\.com|i\\.music\\.163\\.com|api\\.iplay\\.163\\.com|music\\.126\\.net)\\/"
      env:
        ENABLE_CAPTURE: "{{{ENABLE_CAPTURE}}}"
      script_url: "https://raw.githubusercontent.com/buleeee1111/egern-netease-checkin/main/netease-checkin-v9.js?v=12"
      timeout: 30
      update_interval: 86400

  - schedule:
      name: "网易云音乐每日签到"
      cron: "{{{CronExp}}}"
      script_url: "https://raw.githubusercontent.com/buleeee1111/egern-netease-checkin/main/netease-checkin-v9.js?v=12"
      timeout: 90
      update_interval: 86400

mitm:
  hostnames:
    includes:
      - "music.163.com"
      - "*.music.163.com"
      - "interface3.music.163.com"
      - "interface.music.163.com"
      - "m.music.163.com"
      - "i.music.163.com"
      - "api.iplay.163.com"
      - "music.126.net"
      - "*.music.126.net"
